[project]
name = "keil-bridge"
version = "0.1.0"
description = "Convert Keil MDK projects to a GCC/Makefile tree and backport edits to the Keil project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keil-bridge = "keil_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keil_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Test data contains Chinese text written in GBK.
ignore = ["SIM108"]  # an if/else block is clearer than a long conditional expression
allowed-confusables = ["："]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
files = ["src", "tests"]
mypy_path = "tests"
check_untyped_defs = true
warn_unused_ignores = true
